<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg dg-mesh" viewBox="0 0 520 360" width="520" height="360" role="img" aria-labelledby="dg-mesh-wide-title" aria-describedby="dg-mesh-wide-desc"><title id="dg-mesh-wide-title">Concept illustration: three personal meshes joined by architectural lanes</title><desc id="dg-mesh-wide-desc">Three personal meshes, yours, a friend's and a team's. Each owner's machines report heartbeats to their own hub, and dashed architectural lanes join the hubs; they are not live connections. Machine state is drawn by shape: online is a filled disc, stale a half disc, offline a hollow diamond and unknown a dashed ring. Copper marks capacity an owner chooses to share: two machines in your mesh and one in each other mesh.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;fill:#0f1f1a}.dg-bg{fill:#f8faf7;stroke:#d5ddd6}.dg-dot{fill:#c3cec5}.dg-dots{fill:url(#dg-dots)}.dg-label{font-weight:600}.dg-sublabel,.dg-statelabel{fill:#4a5d55}.dg-elabel{fill:#4a5d55;paint-order:stroke;stroke:#f8faf7;stroke-width:5px;stroke-linejoin:round}.dg-group{fill:#4a5d55;font-weight:500}.dg-box{fill:#ffffff;stroke:#c3cec5;stroke-width:1}.dg-owner .dg-box{fill:#f6e8dc;stroke:#a24e16}.dg-s-optional .dg-box{stroke:#75897f;stroke-dasharray:4 3}.dg-mark{fill:none;stroke:#0f1f1a;stroke-width:1.5}.dg-m-built{fill:#0f1f1a;stroke:none}.dg-m-notlive,.dg-m-optional{stroke:#4a5d55;stroke-dasharray:2.2 2}.dg-edge{fill:none;stroke:#75897f;stroke-width:1.5;stroke-linecap:round}.dg-k-heartbeat{stroke-dasharray:1.5 4}.dg-k-optional{stroke-dasharray:6 5}.dg-k-architectural{stroke-dasharray:5 6}.dg-arrow{fill:#75897f}.dg-port{fill:#ffffff;stroke:#75897f;stroke-width:1.5}.dg-mesh .dg-edge{stroke-width:1.25}.dg-mesh .dg-k-architectural{stroke-width:1.5}.dg-idle{opacity:.45}.dg-hub{fill:#0f1f1a}.dg-share{fill:#f6e8dc;stroke:#a24e16;stroke-width:1.5}.dg-shape{stroke-width:1.5;fill:#ffffff}.dg-shape.dg-st-online{fill:#1d7048;stroke:#1d7048}.dg-st-stale{stroke:#85590a}.dg-fill.dg-st-stale{fill:#85590a;stroke:none}.dg-st-offline{stroke:#b42b1f}.dg-st-unknown{stroke:#4651b5;stroke-dasharray:2 2}</style><defs><pattern id="dg-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="dg-dot" cx="8" cy="8" r="1"/></pattern></defs><rect class="dg-bg" x="0.5" y="0.5" width="519" height="359" rx="8"/><rect class="dg-dots" width="520" height="360" rx="8"/><g class="dg-edges"><path class="dg-edge dg-k-heartbeat dg-b1" d="M86 140 L150 190"/><path class="dg-edge dg-k-heartbeat dg-b2" d="M70 224 L150 190"/><path class="dg-edge dg-k-heartbeat dg-b3" d="M112 282 L150 190"/><path class="dg-edge dg-k-heartbeat dg-b4" d="M216 272 L150 190"/><path class="dg-edge dg-k-heartbeat dg-idle dg-b1" d="M208 124 L150 190"/><path class="dg-edge dg-k-heartbeat dg-b2" d="M434 58 L370 96"/><path class="dg-edge dg-k-heartbeat dg-b3" d="M452 128 L370 96"/><path class="dg-edge dg-k-heartbeat dg-idle dg-b4" d="M308 60 L370 96"/><path class="dg-edge dg-k-heartbeat dg-b1" d="M410 160 L370 96"/><path class="dg-edge dg-k-heartbeat dg-b2" d="M462 226 L390 252"/><path class="dg-edge dg-k-heartbeat dg-idle dg-b3" d="M458 298 L390 252"/><path class="dg-edge dg-k-heartbeat dg-b4" d="M330 296 L390 252"/><path class="dg-edge dg-k-heartbeat dg-idle dg-b1" d="M410 318 L390 252"/><path class="dg-edge dg-k-architectural dg-b2" d="M150 190 L370 96"/><path class="dg-edge dg-k-architectural dg-b3" d="M150 190 L390 252"/><path class="dg-edge dg-k-architectural dg-b4" d="M370 96 L390 252"/></g><g class="dg-nodes"><g class="dg-node dg-lane-you"><circle class="dg-hub" cx="150" cy="190" r="7.5"/></g><g class="dg-node dg-lane-you"><circle class="dg-shape dg-st-online" cx="86" cy="140" r="5"/></g><g class="dg-node dg-lane-you dg-shared"><circle class="dg-share" cx="70" cy="224" r="11"/><circle class="dg-shape dg-st-online" cx="70" cy="224" r="5"/></g><g class="dg-node dg-lane-you"><circle class="dg-shape dg-st-stale" cx="112" cy="282" r="5"/><path class="dg-fill dg-st-stale" d="M112 277 A5 5 0 0 0 112 287Z"/></g><g class="dg-node dg-lane-you dg-shared"><circle class="dg-share" cx="216" cy="272" r="11"/><circle class="dg-shape dg-st-online" cx="216" cy="272" r="5"/></g><g class="dg-node dg-lane-you"><path class="dg-shape dg-st-offline" d="M208 118 L214 124 L208 130 L202 124Z"/></g><g class="dg-node dg-lane-friend"><circle class="dg-hub" cx="370" cy="96" r="7.5"/></g><g class="dg-node dg-lane-friend"><circle class="dg-shape dg-st-online" cx="434" cy="58" r="5"/></g><g class="dg-node dg-lane-friend dg-shared"><circle class="dg-share" cx="452" cy="128" r="11"/><circle class="dg-shape dg-st-online" cx="452" cy="128" r="5"/></g><g class="dg-node dg-lane-friend"><circle class="dg-shape dg-st-unknown" cx="308" cy="60" r="5"/></g><g class="dg-node dg-lane-friend"><circle class="dg-shape dg-st-stale" cx="410" cy="160" r="5"/><path class="dg-fill dg-st-stale" d="M410 155 A5 5 0 0 0 410 165Z"/></g><g class="dg-node dg-lane-team"><circle class="dg-hub" cx="390" cy="252" r="7.5"/></g><g class="dg-node dg-lane-team"><circle class="dg-shape dg-st-online" cx="462" cy="226" r="5"/></g><g class="dg-node dg-lane-team"><path class="dg-shape dg-st-offline" d="M458 292 L464 298 L458 304 L452 298Z"/></g><g class="dg-node dg-lane-team dg-shared"><circle class="dg-share" cx="330" cy="296" r="11"/><circle class="dg-shape dg-st-online" cx="330" cy="296" r="5"/></g><g class="dg-node dg-lane-team"><circle class="dg-shape dg-st-unknown" cx="410" cy="318" r="5"/></g></g><g class="dg-groups"><text class="dg-group" x="150" y="346" font-size="14" text-anchor="middle">Your mesh</text><text class="dg-group" x="370" y="24" font-size="14" text-anchor="middle">A friend’s mesh</text><text class="dg-group" x="390" y="350" font-size="14" text-anchor="middle">Team mesh</text></g></svg>
