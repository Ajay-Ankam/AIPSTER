<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg dg-flow" viewBox="0 0 1040 288" width="1040" height="288" role="img" aria-labelledby="dg-research-wide-title" aria-describedby="dg-research-wide-desc"><title id="dg-research-wide-title">Proposed design: from bounded search to a separate release decision</title><desc id="dg-research-wide-desc">Proposed design, not a deployed integration. IRB refinement offers a reuse facade to an external, trusted DGM controller with its archive. The controller sends a RunSpec to a bounded, Karpathy-style experiment loop and receives development evidence back. Optional JEV advice can rank or abstain but has no execution authority. Artifacts go to an independent evaluation. Only after search stops does a promotion gate run a separate held-out suite and a final audit, and human approval leads to a separate release decision. No promotion or final-audit feedback returns to the same search campaign.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;fill:#0f1f1a}.dg-bg{fill:#f8faf7;stroke:#d5ddd6}.dg-dot{fill:#c3cec5}.dg-dots{fill:url(#dg-dots)}.dg-label{font-weight:600}.dg-sublabel,.dg-statelabel{fill:#4a5d55}.dg-elabel{fill:#4a5d55;paint-order:stroke;stroke:#f8faf7;stroke-width:5px;stroke-linejoin:round}.dg-group{fill:#4a5d55;font-weight:500}.dg-box{fill:#ffffff;stroke:#c3cec5;stroke-width:1}.dg-owner .dg-box{fill:#f6e8dc;stroke:#a24e16}.dg-s-optional .dg-box{stroke:#75897f;stroke-dasharray:4 3}.dg-mark{fill:none;stroke:#0f1f1a;stroke-width:1.5}.dg-m-built{fill:#0f1f1a;stroke:none}.dg-m-notlive,.dg-m-optional{stroke:#4a5d55;stroke-dasharray:2.2 2}.dg-edge{fill:none;stroke:#75897f;stroke-width:1.5;stroke-linecap:round}.dg-k-heartbeat{stroke-dasharray:1.5 4}.dg-k-optional{stroke-dasharray:6 5}.dg-k-architectural{stroke-dasharray:5 6}.dg-arrow{fill:#75897f}.dg-port{fill:#ffffff;stroke:#75897f;stroke-width:1.5}.dg-mesh .dg-edge{stroke-width:1.25}.dg-mesh .dg-k-architectural{stroke-width:1.5}.dg-idle{opacity:.45}.dg-hub{fill:#0f1f1a}.dg-share{fill:#f6e8dc;stroke:#a24e16;stroke-width:1.5}.dg-shape{stroke-width:1.5;fill:#ffffff}.dg-shape.dg-st-online{fill:#1d7048;stroke:#1d7048}.dg-st-stale{stroke:#85590a}.dg-fill.dg-st-stale{fill:#85590a;stroke:none}.dg-st-offline{stroke:#b42b1f}.dg-st-unknown{stroke:#4651b5;stroke-dasharray:2 2}</style><defs><pattern id="dg-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="dg-dot" cx="8" cy="8" r="1"/></pattern></defs><rect class="dg-bg" x="0.5" y="0.5" width="1039" height="287" rx="8"/><rect class="dg-dots" width="1040" height="288" rx="8"/><g class="dg-edges"><path class="dg-edge dg-k-request" d="M192 68 L296 68"/><path class="dg-arrow dg-k-request" d="M296 68 L289 72.5 L289 63.5Z"/><path class="dg-edge dg-k-request" d="M464 62 L568 62"/><path class="dg-arrow dg-k-request" d="M568 62 L561 66.5 L561 57.5Z"/><path class="dg-edge dg-k-result" d="M568 74 L464 74"/><path class="dg-arrow dg-k-result" d="M464 74 L471 69.5 L471 78.5Z"/><path class="dg-edge dg-k-request" d="M736 68 L840 68"/><path class="dg-arrow dg-k-request" d="M840 68 L833 72.5 L833 63.5Z"/><path class="dg-edge dg-k-optional" d="M380 176 L380 112"/><path class="dg-arrow dg-k-optional" d="M380 112 L384.5 119 L375.5 119Z"/><path class="dg-edge dg-k-request" d="M924 112 L924 176"/><path class="dg-arrow dg-k-request" d="M924 176 L919.5 169 L928.5 169Z"/><path class="dg-edge dg-k-request" d="M840 220 L736 220"/><path class="dg-arrow dg-k-request" d="M736 220 L743 215.5 L743 224.5Z"/></g><g class="dg-ports"><circle class="dg-port" cx="192" cy="68" r="2.5"/><circle class="dg-port" cx="464" cy="62" r="2.5"/><circle class="dg-port" cx="568" cy="74" r="2.5"/><circle class="dg-port" cx="736" cy="68" r="2.5"/><circle class="dg-port" cx="380" cy="176" r="2.5"/><circle class="dg-port" cx="924" cy="112" r="2.5"/><circle class="dg-port" cx="840" cy="220" r="2.5"/></g><g class="dg-nodes"><g class="dg-node dg-s-planned dg-lane-search"><rect class="dg-box" x="24" y="24" width="168" height="88" rx="6"/><circle class="dg-mark dg-m-planned" cx="176" cy="40" r="4.5"/><text class="dg-label" x="36" y="49.8" font-size="14.5">IRB refinement</text><text class="dg-sublabel" x="36" y="67.4" font-size="13">Selective reuse only</text></g><g class="dg-node dg-s-planned dg-lane-search"><rect class="dg-box" x="296" y="24" width="168" height="88" rx="6"/><circle class="dg-mark dg-m-planned" cx="448" cy="40" r="4.5"/><text class="dg-label" x="308" y="49.8" font-size="14.5">DGM controller</text><text class="dg-sublabel" x="308" y="67.4" font-size="13">External, trusted,</text><text class="dg-sublabel" x="308" y="84.3" font-size="13">with archive</text></g><g class="dg-node dg-s-planned dg-lane-search"><rect class="dg-box" x="568" y="24" width="168" height="88" rx="6"/><circle class="dg-mark dg-m-planned" cx="720" cy="40" r="4.5"/><text class="dg-label" x="580" y="49.8" font-size="14.5">Bounded</text><text class="dg-label" x="580" y="67.5" font-size="14.5">experiment loop</text><text class="dg-sublabel" x="580" y="85.1" font-size="13">Karpathy-style, local</text></g><g class="dg-node dg-s-planned dg-lane-search"><rect class="dg-box" x="840" y="24" width="168" height="88" rx="6"/><circle class="dg-mark dg-m-planned" cx="992" cy="40" r="4.5"/><text class="dg-label" x="852" y="49.8" font-size="14.5">Independent</text><text class="dg-label" x="852" y="67.5" font-size="14.5">evaluation</text><text class="dg-sublabel" x="852" y="85.1" font-size="13">Frozen development</text><text class="dg-sublabel" x="852" y="102" font-size="13">protocol</text></g><g class="dg-node dg-s-optional dg-lane-search"><rect class="dg-box" x="296" y="176" width="168" height="88" rx="6"/><circle class="dg-mark dg-m-optional" cx="448" cy="192" r="4.5"/><text class="dg-label" x="308" y="201.8" font-size="14.5">JEV advice</text><text class="dg-sublabel" x="308" y="219.4" font-size="13">Optional, advisory</text><text class="dg-sublabel" x="308" y="236.3" font-size="13">only</text></g><g class="dg-node dg-s-planned dg-lane-promotion"><rect class="dg-box" x="840" y="176" width="168" height="88" rx="6"/><circle class="dg-mark dg-m-planned" cx="992" cy="192" r="4.5"/><text class="dg-label" x="852" y="201.8" font-size="14.5">Promotion gate</text><text class="dg-sublabel" x="852" y="219.4" font-size="13">Held-out suite, final</text><text class="dg-sublabel" x="852" y="236.3" font-size="13">audit</text></g><g class="dg-node dg-s-planned dg-lane-promotion"><rect class="dg-box" x="568" y="176" width="168" height="88" rx="6"/><circle class="dg-mark dg-m-planned" cx="720" cy="192" r="4.5"/><text class="dg-label" x="580" y="201.8" font-size="14.5">Release decision</text><text class="dg-sublabel" x="580" y="219.4" font-size="13">Separate release</text><text class="dg-sublabel" x="580" y="236.3" font-size="13">action</text></g></g><g class="dg-elabels"><text class="dg-elabel" x="244" y="61" font-size="13" text-anchor="middle">reuse facade</text><text class="dg-elabel" x="516" y="55" font-size="13" text-anchor="middle">RunSpec</text><text class="dg-elabel" x="516" y="91" font-size="13" text-anchor="middle">dev evidence</text><text class="dg-elabel" x="788" y="61" font-size="13" text-anchor="middle">artifact</text><text class="dg-elabel" x="388" y="148.6" font-size="13" text-anchor="start">ranking / abstain</text><text class="dg-elabel" x="916" y="148.6" font-size="13" text-anchor="end">after search stops</text><text class="dg-elabel" x="788" y="213" font-size="13" text-anchor="middle">human approval</text></g></svg>
