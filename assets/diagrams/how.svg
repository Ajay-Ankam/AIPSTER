<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg dg-flow" viewBox="0 0 1040 248" width="1040" height="248" role="img" aria-labelledby="dg-how-wide-title" aria-describedby="dg-how-wide-desc"><title id="dg-how-wide-title">How it would work: four owner-controlled steps</title><desc id="dg-how-wide-desc">The owner sits at the centre and decides each step in order: choose your capacity, choose who can use it, set limits and keep visibility, then revoke access when needed. The first two steps are proposed, the third is planned controls, and revocation is not live. Secure sharing is not live yet.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;fill:#0f1f1a}.dg-bg{fill:#f8faf7;stroke:#d5ddd6}.dg-dot{fill:#c3cec5}.dg-dots{fill:url(#dg-dots)}.dg-label{font-weight:600}.dg-sublabel,.dg-statelabel{fill:#4a5d55}.dg-elabel{fill:#4a5d55;paint-order:stroke;stroke:#f8faf7;stroke-width:5px;stroke-linejoin:round}.dg-group{fill:#4a5d55;font-weight:500}.dg-box{fill:#ffffff;stroke:#c3cec5;stroke-width:1}.dg-owner .dg-box{fill:#f6e8dc;stroke:#a24e16}.dg-s-optional .dg-box{stroke:#75897f;stroke-dasharray:4 3}.dg-mark{fill:none;stroke:#0f1f1a;stroke-width:1.5}.dg-m-built{fill:#0f1f1a;stroke:none}.dg-m-notlive,.dg-m-optional{stroke:#4a5d55;stroke-dasharray:2.2 2}.dg-edge{fill:none;stroke:#75897f;stroke-width:1.5;stroke-linecap:round}.dg-k-heartbeat{stroke-dasharray:1.5 4}.dg-k-optional{stroke-dasharray:6 5}.dg-k-architectural{stroke-dasharray:5 6}.dg-arrow{fill:#75897f}.dg-port{fill:#ffffff;stroke:#75897f;stroke-width:1.5}.dg-mesh .dg-edge{stroke-width:1.25}.dg-mesh .dg-k-architectural{stroke-width:1.5}.dg-idle{opacity:.45}.dg-hub{fill:#0f1f1a}.dg-share{fill:#f6e8dc;stroke:#a24e16;stroke-width:1.5}.dg-shape{stroke-width:1.5;fill:#ffffff}.dg-shape.dg-st-online{fill:#1d7048;stroke:#1d7048}.dg-st-stale{stroke:#85590a}.dg-fill.dg-st-stale{fill:#85590a;stroke:none}.dg-st-offline{stroke:#b42b1f}.dg-st-unknown{stroke:#4651b5;stroke-dasharray:2 2}</style><defs><pattern id="dg-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="dg-dot" cx="8" cy="8" r="1"/></pattern></defs><rect class="dg-bg" x="0.5" y="0.5" width="1039" height="247" rx="8"/><rect class="dg-dots" width="1040" height="248" rx="8"/><g class="dg-edges"><path class="dg-edge dg-k-architectural" d="M520 80 L520 100 Q520 108 512 108 L144 108 Q136 108 136 116 L136 136"/><path class="dg-edge dg-k-architectural" d="M520 80 L520 100 Q520 108 512 108 L400 108 Q392 108 392 116 L392 136"/><path class="dg-edge dg-k-architectural" d="M520 80 L520 100 Q520 108 528 108 L640 108 Q648 108 648 116 L648 136"/><path class="dg-edge dg-k-architectural" d="M520 80 L520 100 Q520 108 528 108 L896 108 Q904 108 904 116 L904 136"/><path class="dg-edge dg-k-request" d="M248 184 L280 184"/><path class="dg-arrow dg-k-request" d="M280 184 L273 188.5 L273 179.5Z"/><path class="dg-edge dg-k-request" d="M504 184 L536 184"/><path class="dg-arrow dg-k-request" d="M536 184 L529 188.5 L529 179.5Z"/><path class="dg-edge dg-k-request" d="M760 184 L792 184"/><path class="dg-arrow dg-k-request" d="M792 184 L785 188.5 L785 179.5Z"/></g><g class="dg-ports"><circle class="dg-port" cx="520" cy="80" r="2.5"/><circle class="dg-port" cx="136" cy="136" r="2.5"/><circle class="dg-port" cx="392" cy="136" r="2.5"/><circle class="dg-port" cx="648" cy="136" r="2.5"/><circle class="dg-port" cx="904" cy="136" r="2.5"/><circle class="dg-port" cx="248" cy="184" r="2.5"/><circle class="dg-port" cx="504" cy="184" r="2.5"/><circle class="dg-port" cx="760" cy="184" r="2.5"/></g><g class="dg-nodes"><g class="dg-node dg-s-none dg-lane-owner dg-owner"><rect class="dg-box" x="408" y="16" width="224" height="64" rx="6"/><text class="dg-label" x="420" y="41.8" font-size="14.5">Owner</text><text class="dg-sublabel" x="420" y="59.4" font-size="13">Your compute, your terms</text></g><g class="dg-node dg-s-planned dg-lane-steps"><rect class="dg-box" x="24" y="136" width="224" height="96" rx="6"/><circle class="dg-mark dg-m-planned" cx="41" cy="154" r="4.5"/><text class="dg-statelabel" x="51" y="158.5" font-size="13">Proposed</text><text class="dg-label" x="36" y="181.8" font-size="14.5">Choose your capacity</text><text class="dg-sublabel" x="36" y="199.4" font-size="13">Local CPUs, GPUs, clusters</text></g><g class="dg-node dg-s-planned dg-lane-steps"><rect class="dg-box" x="280" y="136" width="224" height="96" rx="6"/><circle class="dg-mark dg-m-planned" cx="297" cy="154" r="4.5"/><text class="dg-statelabel" x="307" y="158.5" font-size="13">Proposed</text><text class="dg-label" x="292" y="181.8" font-size="14.5">Choose who can use it</text><text class="dg-sublabel" x="292" y="199.4" font-size="13">People and teams</text></g><g class="dg-node dg-s-planned dg-lane-steps"><rect class="dg-box" x="536" y="136" width="224" height="96" rx="6"/><circle class="dg-mark dg-m-planned" cx="553" cy="154" r="4.5"/><text class="dg-statelabel" x="563" y="158.5" font-size="13">Planned controls</text><text class="dg-label" x="548" y="181.8" font-size="14.5">Set limits and keep</text><text class="dg-label" x="548" y="199.5" font-size="14.5">visibility</text><text class="dg-sublabel" x="548" y="217.1" font-size="13">Usage and access</text></g><g class="dg-node dg-s-notlive dg-lane-steps"><rect class="dg-box" x="792" y="136" width="224" height="96" rx="6"/><circle class="dg-mark dg-m-notlive" cx="809" cy="154" r="4.5"/><text class="dg-statelabel" x="819" y="158.5" font-size="13">Not live</text><text class="dg-label" x="804" y="181.8" font-size="14.5">Revoke access when needed</text><text class="dg-sublabel" x="804" y="199.4" font-size="13">Owner control</text></g></g><g class="dg-elabels"></g></svg>
