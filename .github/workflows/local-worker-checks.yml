name: Public local worker installation
on:
  pull_request:
    paths:
      - 'local-worker/**'
      - 'website/src/**'
      - 'website/migrations/**'
      - 'website/tests/d1-shim.mjs'
      - 'website/scripts/pairing-e2e-bridge.mjs'
      - 'website/package*.json'
      - '.github/workflows/local-worker-checks.yml'
      - 'LICENSE'
      - 'NOTICE'
  # Merged-main coverage for the automatic production gate: EVERY main push
  # runs the suite, with no path filter, so every merged SHA carries its own
  # mock-install result. The deploy workflow still measures worker
  # applicability over the cumulative live-to-target range (fail-closed) and
  # requires the result via WORKER_APPLICABLE; unneeded runs are harmless,
  # but a registry-only or docs-only push after worker changes must never
  # leave its target without evidence again (0de5103 bootstrap gap).
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mock-install:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0 # source-update pin tests read f3e115e..3fa309c history
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7 resolved 2026-10-28
        with:
          version: '0.12.12'
          enable-cache: false
      - run: uv python install 3.12.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, same pin as public-site checks
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: website
      - run: uv run --no-project --python 3.12.14 python install.py
        working-directory: local-worker
      - run: ./.venv/Scripts/python.exe test_installation.py
        working-directory: local-worker
      - run: ./.venv/Scripts/python.exe -m unittest test_model_identity test_pairing test_pairing_security test_pairing_windows_storage test_pairing_lifecycle test_pairing_e2e test_sender_lock test_source_update test_capability_report test_verify_vendor test_macos_lifecycle test_private_dir_settle test_runtime_setup_plan test_fabric_openai_proxy test_model_readiness test_inference_worker test_attach_usable test_attach_usable_contract test_fabric_site068_report -v
        working-directory: local-worker
